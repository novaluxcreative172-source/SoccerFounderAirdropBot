services:
  - type: web
    name: soccerfounder-airdrop-bot
    runtime: node
    plan: starter
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma db push && npm run prisma:seed && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: soccerfounder-db
          property: connectionString
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: BOT_USERNAME
        value: SoccerFounderAirdropBot
      - key: WEBSITE_URL
        value: https://www.SoccerFounder.com
      - key: COACH_BOT_USERNAME
        value: SoccerFounderCoachBot
      - key: REQUIRED_SPONSOR
        value: Shane
      - key: ENGAGEMENT_DAYS
        value: "30"
      - key: MIN_WITHDRAWAL_NGN
        value: "1000"
databases:
  - name: soccerfounder-db
    plan: basic-256mb
    databaseName: soccerfounder
    user: soccerfounder
